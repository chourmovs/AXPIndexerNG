name: ANN qualification smoke
on:
  pull_request:
    paths:
      - "shared/axp_core/ann.py"
      - "shared/axp_core/ann_metrics.py"
      - "scripts/benchmark_ann.py"
      - "tests/test_pr_b_ann_benchmark.py"
      - "requirements-ann-benchmark.txt"
      - ".github/workflows/ann-smoke.yml"
  workflow_dispatch:
jobs:
  test-usearch:
    runs-on: windows-latest
    env:
      PYTHONPATH: shared
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements-ann-benchmark.txt pytest
      - run: python -c "from usearch.index import Index; print('USearch available')"
      - run: python -m pytest -q tests/test_pr_b_ann_benchmark.py
