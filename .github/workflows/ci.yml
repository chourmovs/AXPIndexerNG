name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: windows-latest
    env: { PYTHONPATH: "shared;daemon;client;tray" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: python --version
      - run: python -m pip install -r requirements-runtime.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check .
      - run: python -m compileall daemon client shared tray AXPIndexerTray.pyw
      - run: pytest -q
      - name: Real capabilities and inference
        shell: python
        run: |
          import sqlite3, tempfile
          import sqlite_vec
          from axp_daemon.embeddings import Embedder
          c=sqlite3.connect(':memory:'); c.enable_load_extension(True); sqlite_vec.load(c)
          assert c.execute('select vec_version()').fetchone()
          c.execute('create virtual table v using vec0(x float[2])')
          c.execute("insert into v(rowid,x) values(1,vec_f32('[1,0]'))")
          assert c.execute("select rowid from v where x match vec_f32('[1,0]') and k=1").fetchone()[0]==1
          c.execute('create virtual table f using fts5(x)'); c.execute("insert into f values('reactor pressure')"); assert c.execute("select * from f where f match 'reactor'").fetchone()
          cache=tempfile.mkdtemp()
          model=Embedder('balanced', cache_dir=cache, local_only=False, runtime_batch_size=2)
          assert len(model.embed_documents(['reactor pressure','bleach dosing','storage']))==3
          assert len(model.embed_query('reactor'))==384
