name: Portable release
on:
  workflow_dispatch:
  push: { tags: ["v*"] }
permissions: { contents: write }
jobs:
  portable:
    runs-on: windows-latest
    env:
      # This must cover every packaged interpreter and any Python descendants.
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Verify immutable chat model catalog
        shell: pwsh
        run: |
          $env:PYTHONPATH=(Resolve-Path client).Path
          python -m pip install -r requirements-catalog-verifier.txt
          if ($LASTEXITCODE -ne 0) { throw 'Catalog verifier dependency installation failed' }
          python scripts/verify_chat_model_catalog.py
      - name: Download and verify WinPython 3.11.8
        shell: pwsh
        run: |
          $url='https://github.com/winpython/winpython/releases/download/7.1.20240203final/Winpython64-3.11.8.0dot.exe'
          Invoke-WebRequest $url -OutFile winpython.exe
          if ((Get-FileHash winpython.exe -Algorithm SHA256).Hash.ToLower() -ne '54c501574df21c3c1883fda4f5e8ff73883ede72844ae6700252143ecc024d47') { throw 'WinPython SHA256 mismatch' }
          Start-Process ./winpython.exe -ArgumentList '-y','-oWinPython' -Wait
          $py=(Get-ChildItem WinPython -Recurse python.exe | Select-Object -First 1).FullName
          "PY=$py" | Out-File $env:GITHUB_ENV -Append
      - name: Assemble runtime and install runtime roots only
        shell: pwsh
        run: |
          New-Item -ItemType Directory stage/AXPIndexerNG | Out-Null
          Copy-Item (Split-Path $env:PY) stage/AXPIndexerNG/python -Recurse
          $env:CMAKE_ARGS='-DGGML_NATIVE=OFF -DGGML_AVX=ON -DGGML_AVX2=OFF -DGGML_BMI2=OFF -DGGML_AVX512=OFF -DGGML_AVX512_VBMI=OFF -DGGML_AVX512_VNNI=OFF -DGGML_AVX512_BF16=OFF -DGGML_LLAMAFILE=OFF -DGGML_CUDA=OFF -DGGML_VULKAN=OFF -DGGML_SYCL=OFF'
          $env:FORCE_CMAKE='1'
          & stage/AXPIndexerNG/python/python.exe -B -m pip install --no-binary llama-cpp-python -r requirements-runtime.txt
          if ($LASTEXITCODE -ne 0) { throw 'Controlled portable llama-cpp-python source build failed' }
          Copy-Item daemon,client,shared,tray,scripts,README.md,AXPIndexerTray.pyw,AXPIndexerTray.vbs,AXPIndexerDaemon.pyw,config.example.json stage/AXPIndexerNG -Recurse
          New-Item -ItemType Directory stage/AXPIndexerNG/data,stage/AXPIndexerNG/data/logs,stage/AXPIndexerNG/data/runtime -Force | Out-Null
          @(
            '@echo off'
            'set "PYTHONPATH=%~dp0shared;%~dp0daemon;%~dp0client;%~dp0tray"'
            'set "PYTHONDONTWRITEBYTECODE=1"'
            '"%~dp0python\python.exe" -B -m axp_daemon %*'
          ) | Set-Content stage/AXPIndexerNG/AXPIndexerDaemon.bat -Encoding ascii
          @(
            '@echo off'
            'set "PYTHONPATH=%~dp0shared;%~dp0daemon;%~dp0client;%~dp0tray"'
            'set "PYTHONDONTWRITEBYTECODE=1"'
            '"%~dp0python\python.exe" -B -m axp_client %*'
          ) | Set-Content stage/AXPIndexerNG/AXPIndexerClient.bat -Encoding ascii
          $env:PYTHONPATH=(Resolve-Path stage/AXPIndexerNG/shared).Path+';'+(Resolve-Path stage/AXPIndexerNG/daemon).Path+';'+(Resolve-Path stage/AXPIndexerNG/client).Path+';'+(Resolve-Path stage/AXPIndexerNG/tray).Path
          & stage/AXPIndexerNG/python/python.exe -B -c "import tkinter,pystray,PIL,openpyxl,importlib.metadata,platform; import llama_cpp; from llama_cpp import Llama; from axp_client.rag.cpu import detect_cpu; from pathlib import Path; print('llama-cpp-python',importlib.metadata.version('llama-cpp-python')); print('system',platform.platform(),detect_cpu().public()); print('backend',llama_cpp.llama_print_system_info().decode(errors='replace')); assert detect_cpu().runtime_required_isa == 'x86-64 + AVX'; root=Path(r'stage/AXPIndexerNG'); required=('AXPIndexerTray.pyw','AXPIndexerDaemon.pyw','python/python.exe','python/pythonw.exe'); assert all((root/path).is_file() for path in required); compile((root/'AXPIndexerDaemon.pyw').read_bytes(), str(root/'AXPIndexerDaemon.pyw'), 'exec')"
          if ($LASTEXITCODE -ne 0) { throw 'Packaged desktop imports or pythonw.exe check failed' }
          & stage/AXPIndexerNG/python/python.exe -B stage/AXPIndexerNG/scripts/verify_llama_runtime.py
          if ($LASTEXITCODE -ne 0) { throw 'Packaged llama.cpp ISA policy verification failed' }
          & stage/AXPIndexerNG/python/python.exe -B -m axp_tray self-test --db stage/tray-self-test.db
          if ($LASTEXITCODE -ne 0) { throw 'Packaged tray self-test failed' }
          $sourceDb=(Join-Path (Resolve-Path stage).Path 'source-smoke.db')
          & stage/AXPIndexerNG/python/python.exe -B -m axp_daemon source add --db $sourceDb --path 'D:\Process'
          & stage/AXPIndexerNG/python/python.exe -B -m axp_daemon source add --db $sourceDb --path '\\SERVER\Documentation'
          $sourceStatus=& stage/AXPIndexerNG/python/python.exe -B -m axp_daemon source list --db $sourceDb | ConvertFrom-Json
          if ($sourceStatus.Count -ne 2) { throw 'Packaged multi-source CRUD smoke failed' }
          $launchers = Get-Content stage/AXPIndexerNG/AXPIndexerDaemon.bat,stage/AXPIndexerNG/AXPIndexerClient.bat -Raw
          if ($launchers.Contains('`r`n')) { throw 'BAT launcher contains literal newline escape text' }
          New-Item -ItemType Directory stage/smoke-docs | Out-Null
          'reactor pressure control R042500' | Set-Content stage/smoke-docs/reactor.txt
          $daemon = (Resolve-Path stage/AXPIndexerNG/AXPIndexerDaemon.bat).Path
          $client = (Resolve-Path stage/AXPIndexerNG/AXPIndexerClient.bat).Path
          $db = (Join-Path (Resolve-Path stage).Path 'launcher-smoke.db')
          $root = (Resolve-Path stage/smoke-docs).Path
          function Invoke-Checked([string]$launcher, [string[]]$arguments) {
            $output = & $launcher @arguments
            if ($LASTEXITCODE -ne 0) { throw "Generated BAT launcher failed: $launcher $arguments" }
            if ($output -match '^(@echo|set |".*python)') { throw 'BAT launcher echoed its contents' }
            $null = $output | ConvertFrom-Json -ErrorAction Stop
            return $output
          }
          $null = Invoke-Checked $daemon @('health','--db',$db)
          $null = Invoke-Checked $daemon @('scan','--db',$db,'--root',$root,'--allow-download')
          $null = Invoke-Checked $daemon @('status','--db',$db)
          $null = Invoke-Checked $client @('health','--db',$db)
          $null = Invoke-Checked $client @('search','--db',$db,'--query','reactor','--profile','hybrid')
          # Inventory the actual staged tree before pruning; file and small-file counts are first-class metrics.
          & stage/AXPIndexerNG/python/python.exe -B stage/AXPIndexerNG/scripts/prune_portable_runtime.py audit stage/AXPIndexerNG
          if ($LASTEXITCODE -ne 0) { throw 'Portable runtime pre-prune audit failed' }
          & stage/AXPIndexerNG/python/python.exe -B -m pip freeze
          if ($LASTEXITCODE -ne 0) { throw 'Installed package audit failed' }
          & stage/AXPIndexerNG/python/python.exe -B stage/AXPIndexerNG/scripts/prune_portable_runtime.py prune stage/AXPIndexerNG
          if ($LASTEXITCODE -ne 0) { throw 'Portable runtime pruning or cache sanitation failed' }
          Get-ChildItem stage/AXPIndexerNG/data -File -Recurse | Remove-Item -Force
          & stage/AXPIndexerNG/python/python.exe -B stage/AXPIndexerNG/scripts/prune_portable_runtime.py verify stage/AXPIndexerNG
          if ($LASTEXITCODE -ne 0) { throw 'Final portable runtime cache verification failed' }
          if (Get-ChildItem stage/AXPIndexerNG -File -Recurse -Filter *.gguf) { throw 'GGUF models must not be packaged' }
          $llamaPackage=Get-ChildItem stage/AXPIndexerNG/python -Directory -Recurse -Filter llama_cpp | Select-Object -First 1
          if (!$llamaPackage -or !(Get-ChildItem $llamaPackage.FullName -File -Recurse | Where-Object Extension -In '.dll','.pyd')) { throw 'llama_cpp native runtime missing' }
          $after=(Get-ChildItem stage/AXPIndexerNG -Recurse -File | Measure-Object Length -Sum).Sum; "Runtime after cleanup: $after bytes"
          # The controlled source-built llama.cpp runtime is larger than the former opaque wheel.
          # Keep a bounded gate based on the qualified 412,203,841-byte Windows build.
          Get-ChildItem stage/AXPIndexerNG/python -Directory -Recurse | ForEach-Object { [pscustomobject]@{Path=$_.FullName;Bytes=(Get-ChildItem $_ -File -Recurse | Measure-Object Length -Sum).Sum} } | Sort-Object Bytes -Descending | Select-Object -First 30
          Get-ChildItem stage -File -Recurse | Sort-Object Length -Descending | Select-Object -First 50 FullName,Length
          if ($after -gt 450MB) { throw 'Runtime exceeds 450 MiB' } elseif ($after -gt 400MB) { Write-Warning 'Runtime exceeds 400 MiB qualified baseline' }
          $forbidden='lancedb','pyarrow','pandas','onnxruntime_directml'; foreach($x in $forbidden){if(Get-ChildItem stage -Recurse -ErrorAction SilentlyContinue | Where-Object Name -Like "$x*"){throw "Forbidden package: $x"}}
          # Qualify the final post-prune runtime, rather than only the installation-time tree.
          function Assert-NoBytecode([string]$stageName) {
            & stage/AXPIndexerNG/python/python.exe -B stage/AXPIndexerNG/scripts/prune_portable_runtime.py verify stage/AXPIndexerNG
            if ($LASTEXITCODE -ne 0) { throw "Bytecode invariant failed after: $stageName" }
            Write-Host "Bytecode invariant OK: $stageName"
          }
          # Prove both the packaged parent contract and inheritance by a child which is deliberately
          # launched without -B. Libraries which spawn sys.executable must receive the job invariant.
          $parentProbe = "import os,subprocess,sys; assert sys.dont_write_bytecode is True; assert os.environ.get('PYTHONDONTWRITEBYTECODE') == '1'; print('bytecode_disabled=true'); subprocess.run([sys.executable, '-c', sys.argv[1]], check=True)"
          $childProbe = "import os,sys; assert sys.dont_write_bytecode is True; assert os.environ.get('PYTHONDONTWRITEBYTECODE') == '1'; print('child_bytecode_disabled=true')"
          & stage/AXPIndexerNG/python/python.exe -B -c $parentProbe $childProbe
          if ($LASTEXITCODE -ne 0) { throw 'Packaged Python bytecode contract or child inheritance probe failed' }
          & stage/AXPIndexerNG/python/python.exe -B -c "import tkinter,pystray,PIL,openpyxl,sqlite3,fastembed,psutil,cpuinfo,llama_cpp,importlib.metadata; print('post-prune imports ok')"
          if ($LASTEXITCODE -ne 0) { throw 'Post-prune packaged import smoke failed' }
          Assert-NoBytecode 'post-prune imports'
          & stage/AXPIndexerNG/python/python.exe -B stage/AXPIndexerNG/scripts/verify_llama_runtime.py
          if ($LASTEXITCODE -ne 0) { throw 'Post-prune llama.cpp runtime verification failed' }
          Assert-NoBytecode 'llama runtime verifier'
          & stage/AXPIndexerNG/python/python.exe -B -m axp_tray self-test --db stage/post-prune-tray-self-test.db
          if ($LASTEXITCODE -ne 0) { throw 'Post-prune tray self-test failed' }
          Assert-NoBytecode 'tray self-test'
          $null = Invoke-Checked $daemon @('health','--db',$db)
          Assert-NoBytecode 'daemon health smoke'
          $null = Invoke-Checked $client @('search','--db',$db,'--query','reactor','--profile','hybrid')
          Assert-NoBytecode 'client search smoke'
          # Store files without DEFLATE compression: many small files extract faster without DEFLATE.
          Compress-Archive stage/AXPIndexerNG dist.zip -CompressionLevel NoCompression
          $version=if($env:GITHUB_REF_TYPE -eq 'tag'){$env:GITHUB_REF_NAME.TrimStart('v')}else{'0.1.0-dev'}; $name="AXPIndexerNG-runtime-$version.zip"; Move-Item dist.zip $name
          & stage/AXPIndexerNG/python/python.exe -B stage/AXPIndexerNG/scripts/prune_portable_runtime.py verify-zip $name
          if ($LASTEXITCODE -ne 0) { throw 'STORE ZIP metadata/cache verification failed' }
          (Get-FileHash $name).Hash.ToLower()+"  $name" | Set-Content "$name.sha256"; "ARTIFACT=$name" | Out-File $env:GITHUB_ENV -Append
          $zipBytes=(Get-Item $name).Length
          $alpha2Bytes=109473024
          "ZIP size: $zipBytes bytes"
          "ZIP delta versus v0.2.0-alpha2: $($zipBytes-$alpha2Bytes) bytes (alpha3 had no published asset at implementation time)"
          "Model cache size: 0 bytes (excluded)"
      - uses: actions/upload-artifact@v4
        with: { name: runtime, path: "${{ env.ARTIFACT }}*" }
      - name: Release tagged build
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A rerun may target a release created by an earlier, partially failed job.
          $null = gh release view $env:GITHUB_REF_NAME 2>&1
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:GITHUB_REF_NAME `
              $env:ARTIFACT "$env:ARTIFACT.sha256" --clobber
          } else {
            $releaseArgs = @(
              'release', 'create', $env:GITHUB_REF_NAME,
              $env:ARTIFACT, "$env:ARTIFACT.sha256", '--generate-notes'
            )
            if ($env:GITHUB_REF_NAME -match '-(alpha|beta|rc)') {
              $releaseArgs += '--prerelease'
            }
            gh @releaseArgs
          }
          if ($LASTEXITCODE -ne 0) {
            throw 'GitHub release publication failed'
          }
