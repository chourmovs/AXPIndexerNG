name: Retrieval benchmark
on:
  workflow_dispatch:
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11.8'}
      - run: pip install -r requirements-runtime.txt -r requirements-dev.txt
      - name: Provision real FastEmbed models and run quality benchmark
        run: python scripts/retrieval_benchmark.py --allow-download
