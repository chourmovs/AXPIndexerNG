[workspace]
members = ["core", "daemon", "client"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tracing = "0.1"
tracing-subscriber = "0.3"
walkdir = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
opt-level = "s"
