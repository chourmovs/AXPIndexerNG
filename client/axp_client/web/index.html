<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AXPIndexerNG</title><link rel="stylesheet" href="/style.css"></head>
<body><main>
  <header class="masthead"><h1>AXPIndexerNG</h1><p>Local enterprise document intelligence</p></header>
  <nav class="modes" aria-label="Workflows">
    <button id="search-tab" class="mode active" aria-controls="search-panel" aria-selected="true">Search documents</button>
    <button id="ask-tab" class="mode" aria-controls="ask-panel" aria-selected="false">Ask AXP</button>
  </nav>
  <section id="search-panel"><h2>Search documents</h2>
    <form id="search-form"><label class="sr-only" for="search-input">Search indexed documents</label>
      <input id="search-input" placeholder="Search indexed documents"><button>Search</button></form>
    <section id="results" aria-live="polite"></section>
  </section>
  <section id="ask-panel" hidden><div class="panel-heading"><div><h2>Ask AXP</h2><p class="muted">Local AI · indexed sources only</p></div>
    <button id="clear-chat" class="secondary" type="button">Clear</button></div>
    <div id="ask-health" class="health" aria-live="polite">Checking local AI…</div>
    <button id="manage-ai" type="button" class="secondary compact">Manage local AI</button>
    <aside id="model-manager" class="model-manager" hidden><h3>Local AI models</h3><div id="model-list"></div>
      <fieldset><legend>Hardware acceleration</legend><label><input type="radio" name="device" value="auto" checked> Auto — CPU in this experimental release</label>
      <label><input type="radio" name="device" value="cpu"> CPU</label><label><input type="radio" name="device" value="intel_gpu"> Intel GPU (Experimental) <span id="intel-device-status">— unavailable</span></label></fieldset>
      <section id="intel-runtime-actions"><p id="intel-runtime-description" class="muted"></p>
        <button id="download-intel-runtime" type="button" class="compact">Download Intel GPU runtime</button>
        <div id="intel-runtime-progress"></div>
        <button id="retry-intel-probe" type="button" class="compact" hidden>Retry Intel GPU detection</button>
        <button id="cancel-intel-runtime" type="button" class="secondary compact" hidden>Cancel</button>
        <button id="benchmark-intel" type="button" class="compact" hidden>Benchmark CPU vs Intel GPU</button>
        <button id="cancel-benchmark" type="button" class="secondary compact" hidden>Cancel benchmark</button>
        <button id="remove-intel-runtime" type="button" class="secondary compact" hidden>Remove Intel GPU runtime</button></section>
      <p id="model-manager-error" class="inline-error" aria-live="polite"></p></aside>
    <div id="chat-history" class="chat-history"></div>
    <form id="ask-form" class="ask-form"><label for="ask-input">Ask a question about your indexed documents</label>
      <textarea id="ask-input" maxlength="4000" rows="3" placeholder="Why was the process changed?"></textarea>
      <div class="composer-footer"><small>Ask complete questions for the most reliable results.</small><button id="ask-submit" disabled>Ask AXP</button></div>
    </form><div id="ask-progress" class="progress" aria-live="polite"></div>
  </section>
</main><script type="module" src="/app.js"></script></body></html>
